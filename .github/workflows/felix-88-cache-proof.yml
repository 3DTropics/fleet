name: felix-88 cache proof (scratch)

# SCRATCH proof workflow for dezren39/fleet#88 — deleted before the PR.
# Three arms build the real Containerfile :base target against FRESH
# registry cache refs (so every cache blob is a genuine upload):
#   max-pat:     GHCR_ORG_PAT login, mode=max  (control — today's config)
#   min-pat:     GHCR_ORG_PAT login, mode=min  (the :full step's remedy)
#   max-ghtoken: GITHUB_TOKEN login + packages: write, mode=max
#                (the plain pipeline's proven auth shape)

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  max-pat:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (org PAT, as the variant does)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: dezren39
          password: ${{ secrets.GHCR_ORG_PAT }}
      - name: Build :base, cache-to mode=max (control)
        uses: docker/build-push-action@v6
        with:
          context: containers/fleet-build
          file: containers/fleet-build/Containerfile
          target: base
          load: true
          tags: fleet-build-proof:base
          cache-to: type=registry,ref=ghcr.io/dezren39/fleet-build:buildcache-felix88-maxpat,mode=max

  min-pat:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (org PAT, as the variant does)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: dezren39
          password: ${{ secrets.GHCR_ORG_PAT }}
      - name: Build :base, cache-to mode=min
        uses: docker/build-push-action@v6
        with:
          context: containers/fleet-build
          file: containers/fleet-build/Containerfile
          target: base
          load: true
          tags: fleet-build-proof:base
          cache-to: type=registry,ref=ghcr.io/dezren39/fleet-build:buildcache-felix88-minpat,mode=min

  max-ghtoken:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (GITHUB_TOKEN, as the plain pipeline does)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build :base, cache-to mode=max
        uses: docker/build-push-action@v6
        with:
          context: containers/fleet-build
          file: containers/fleet-build/Containerfile
          target: base
          load: true
          tags: fleet-build-proof:base
          cache-to: type=registry,ref=ghcr.io/dezren39/fleet-build:buildcache-felix88-maxght,mode=max
